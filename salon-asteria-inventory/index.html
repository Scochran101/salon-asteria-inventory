<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- No maximum-scale / user-scalable: pinch zoom must stay available (WCAG 1.4.4). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asteria">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Salon Asteria Inventory</title>
<meta name="theme-color" content="#A3B28B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ==================== ICON SPRITE ====================
     One stroked set at a single weight, inheriting currentColor.
     Replaces the emoji that used to sit in the tab bar. -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="i-count"><path d="M9 4.2h6a1 1 0 0 1 1 1v1.3H8V5.2a1 1 0 0 1 1-1Z"/><path d="M8 6.5H6.2A2.2 2.2 0 0 0 4 8.7v10.6a2.2 2.2 0 0 0 2.2 2.2h11.6a2.2 2.2 0 0 0 2.2-2.2V8.7a2.2 2.2 0 0 0-2.2-2.2H16"/><path d="m9.2 13.4 2.1 2.1 4.2-4.6"/></g>
    <g id="i-browse"><circle cx="11" cy="11" r="6.8"/><path d="m19.8 19.8-3.9-3.9"/></g>
    <g id="i-restock"><path d="M20.6 8.3v7.4a1.9 1.9 0 0 1-.95 1.65l-6.7 3.86a1.9 1.9 0 0 1-1.9 0l-6.7-3.86A1.9 1.9 0 0 1 3.4 15.7V8.3a1.9 1.9 0 0 1 .95-1.65l6.7-3.86a1.9 1.9 0 0 1 1.9 0l6.7 3.86A1.9 1.9 0 0 1 20.6 8.3Z"/><path d="m3.7 7.3 8.3 4.8 8.3-4.8"/><path d="M12 21.4v-9.3"/></g>
    <g id="i-order"><circle cx="9.5" cy="19.6" r="1.4"/><circle cx="17.6" cy="19.6" r="1.4"/><path d="M2.6 3.4h2.3l2.6 11.7a1.5 1.5 0 0 0 1.47 1.18h8.2a1.5 1.5 0 0 0 1.47-1.2L20.4 7.6H5.6"/></g>
    <g id="i-more"><circle cx="5.2" cy="12" r="1.45"/><circle cx="12" cy="12" r="1.45"/><circle cx="18.8" cy="12" r="1.45"/></g>
    <g id="i-refresh"><path d="M3.6 12A8.4 8.4 0 0 1 18 6.1"/><path d="M18.4 2.9v3.6h-3.6"/><path d="M20.4 12A8.4 8.4 0 0 1 6 17.9"/><path d="M5.6 21.1v-3.6h3.6"/></g>
    <g id="i-back"><path d="m14.4 4.8-7.2 7.2 7.2 7.2"/></g>
    <g id="i-next"><path d="m9.6 4.8 7.2 7.2-7.2 7.2"/></g>
    <g id="i-up"><path d="m5.2 14.6 6.8-6.8 6.8 6.8"/></g>
    <g id="i-down"><path d="m5.2 9.4 6.8 6.8 6.8-6.8"/></g>
    <g id="i-backspace"><path d="M8.6 4.9h10.3a2 2 0 0 1 2 2v10.2a2 2 0 0 1-2 2H8.6L2.7 12Z"/><path d="m11.9 9.4 5 5.2m0-5.2-5 5.2"/></g>
    <g id="i-plus"><path d="M12 5.4v13.2M5.4 12h13.2"/></g>
    <g id="i-minus"><path d="M5.4 12h13.2"/></g>
    <g id="i-info"><circle cx="12" cy="12" r="8.8"/><path d="M12 11.2v5.4"/><circle cx="12" cy="7.7" r="1.15" fill="currentColor" stroke="none"/></g>
    <g id="i-alert"><path d="M12 3.6 21.4 20H2.6Z"/><path d="M12 10v4.1"/><circle cx="12" cy="17.2" r="1.05" fill="currentColor" stroke="none"/></g>
    <g id="i-close"><path d="m6.2 6.2 11.6 11.6M17.8 6.2 6.2 17.8"/></g>
    <g id="i-check"><path d="m5.2 12.6 4.8 4.8 8.8-10.8"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="8.8"/><path d="M12 6.9V12l3.4 2.1"/></g>
    <g id="i-chart"><path d="M4 20V4"/><path d="M4 20h16"/><path d="m7.5 15.5 3.6-4.6 3.1 2.6 4.2-6"/></g>
    <g id="i-pin"><path d="M12 21.4s6.8-6.1 6.8-10.6a6.8 6.8 0 1 0-13.6 0C5.2 15.3 12 21.4 12 21.4Z"/><circle cx="12" cy="10.6" r="2.4"/></g>
    <g id="i-book"><path d="M4.4 5.1A1.7 1.7 0 0 1 6.1 3.4H19v13.9H6.1a1.7 1.7 0 0 0-1.7 1.7Z"/><path d="M4.4 19v1.6h14.6"/></g>
    <g id="i-bug"><path d="M8.4 8.2a3.6 3.6 0 0 1 7.2 0v4.9a3.6 3.6 0 0 1-7.2 0Z"/><path d="M8.4 10.4H4.6m15 0h-4M8.4 14.2l-3.3 2m14-2 3.3 2M8.4 6.6 6.2 4.4m9.4 2.2 2.2-2.2"/></g>
    <g id="i-out"><path d="M14.4 7.6V5.4a1.9 1.9 0 0 0-1.9-1.9H5.6a1.9 1.9 0 0 0-1.9 1.9v13.2a1.9 1.9 0 0 0 1.9 1.9h6.9a1.9 1.9 0 0 0 1.9-1.9v-2.2"/><path d="M9.4 12h11.2m-3.3-3.4 3.4 3.4-3.4 3.4"/></g>
  </defs>
</svg>

<!-- ==================== PIN SCREEN ==================== -->
<div id="pin-screen" class="pin hidden">
  <div class="pin__card">
    <img src="img/logo-mark.png" width="432" height="587" alt="Salon Asteria" class="pin__logo">
    <div class="pin__eyebrow">Inventory</div>
    <div id="pin-dots" class="pin__dots" role="img" aria-label="PIN entry"></div>
    <div id="pin-error" class="pin__error" role="alert"></div>
    <div class="pin__pad">
      <button type="button" class="pin-key" data-digit="1">1</button>
      <button type="button" class="pin-key" data-digit="2">2</button>
      <button type="button" class="pin-key" data-digit="3">3</button>
      <button type="button" class="pin-key" data-digit="4">4</button>
      <button type="button" class="pin-key" data-digit="5">5</button>
      <button type="button" class="pin-key" data-digit="6">6</button>
      <button type="button" class="pin-key" data-digit="7">7</button>
      <button type="button" class="pin-key" data-digit="8">8</button>
      <button type="button" class="pin-key" data-digit="9">9</button>
      <span></span>
      <button type="button" class="pin-key" data-digit="0">0</button>
      <button type="button" class="pin-key" id="pin-back" aria-label="Delete last digit">
        <svg class="icon" aria-hidden="true"><use href="#i-backspace"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ==================== LOADING ==================== -->
<div id="loading" class="loading hidden">
  <div class="spinner" role="status" aria-label="Loading"></div>
  <div class="loading__text">Loading inventory…</div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden">
  <div class="shell">
    <header class="appbar">
      <div class="appbar__brand">
        <img src="img/logo-wordmark.png" width="307" height="96" alt="Salon Asteria" class="appbar__logo">
        <div id="header-sub" class="appbar__sub"></div>
      </div>
      <div class="appbar__actions">
        <button type="button" id="save-status" class="savechip" role="status" hidden></button>
        <button type="button" id="btn-refresh" class="icon-btn" aria-label="Refresh data">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
        </button>
      </div>
    </header>
    <!-- The whole view is replaced on navigation, which is too much to
         announce. A screen name is read from #screen-announce instead. -->
    <main id="view" class="view"></main>
    <div id="screen-announce" class="sr-only" aria-live="polite"></div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar__inner">
      <button type="button" class="tab" id="nav-count"   data-go="count">
        <svg class="tab__icon" aria-hidden="true"><use href="#i-count"/></svg><span>Count</span></button>
      <button type="button" class="tab" id="nav-browse"  data-go="browse">
        <svg class="tab__icon" aria-hidden="true"><use href="#i-browse"/></svg><span>Browse</span></button>
      <button type="button" class="tab" id="nav-restock" data-go="restock">
        <svg class="tab__icon" aria-hidden="true"><use href="#i-restock"/></svg><span>Restock</span></button>
      <button type="button" class="tab" id="nav-order"   data-go="order">
        <svg class="tab__icon" aria-hidden="true"><use href="#i-order"/></svg><span>Order</span></button>
      <button type="button" class="tab" id="nav-more"    data-go="more">
        <svg class="tab__icon" aria-hidden="true"><use href="#i-more"/></svg><span>More</span></button>
    </div>
  </nav>
</div>

<!-- Native <dialog>: focus trap, Escape and background inertness come free. -->
<dialog id="modal" class="modal" aria-labelledby="modal-title">
  <div class="modal__box" id="modal-box"></div>
</dialog>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
